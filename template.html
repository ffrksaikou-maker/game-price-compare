<style>
:root {
  --table-width: 1280px;
  --header-h: 56px;
  --fbar-h: 50px;
  --bg: #f6f7fb;
  --card: #fff;
  --border: #e5e7eb;
  --text: #111827;
  --text-sub: #6b7280;
  --highlight: #eddcff;
  --mega: #fff3e0;
  --sv: #e8f5e9;
  --special: #e3f2fd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"メイリオ","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

/* Header */
.header{position:sticky;top:0;z-index:100;height:var(--header-h);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0 20px}
.header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
.header .upd{position:absolute;right:20px;font-size:11px;color:var(--text-sub)}

/* Filter bar */
.fbar{position:sticky;top:var(--header-h);z-index:90;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}
.fg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fg label{font-size:12px;font-weight:600;color:var(--text-sub);white-space:nowrap}
.fb{font-size:12px;padding:5px 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.fb:hover{border-color:#a5b4fc;background:#eef2ff}
.fb.active{border-color:#6366f1;background:#6366f1;color:#fff}
.sb{font-size:12px;padding:5px 14px;border:1.5px solid #f59e0b;border-radius:20px;background:#fffbeb;color:#92400e;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:600;-webkit-tap-highlight-color:transparent}
.sb:hover{background:#fef3c7}.sb.active{background:#f59e0b;color:#fff}

/* Table wrapper */
/* overflow-x: clip does NOT create a scroll container, so thead sticky works relative to viewport */
.tw{max-width:var(--table-width);margin:16px auto;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

/* Thead */
thead{z-index:80}
thead th{background:#f9fafb}
thead th{padding:10px 6px;font-size:11px;font-weight:700;text-align:center;background:#f9fafb;border-bottom:2px solid var(--border);white-space:nowrap}
thead th.sc{background:linear-gradient(180deg,#e0f2fe,#f0f9ff);color:#0369a1;min-width:90px}
thead th.sc a{color:#0369a1;text-decoration:none;border-bottom:1px dashed #0369a1;transition:all .15s}
thead th.sc a:hover{color:#0284c7;border-bottom-style:solid}

/* Body rows */
tbody tr{transition:background .1s}
tbody tr:hover td{background:#f5f3ff !important}
tbody td{padding:7px 5px;font-size:13px;text-align:center;border-bottom:1px solid #f3f4f6;white-space:nowrap}
tr.cat-mega td{background:var(--mega)}tr.cat-sv td{background:var(--sv)}tr.cat-special td{background:var(--special)}tr.cat-ss td{background:#fce4ec}
tr.cat-mega:hover td{background:#ffe0b2 !important}tr.cat-sv:hover td{background:#c8e6c9 !important}tr.cat-special:hover td{background:#bbdefb !important}tr.cat-ss:hover td{background:#f8bbd0 !important}
tr.sh td{font-weight:800;font-size:14px;padding:14px 10px;text-align:left;border-bottom:2px solid var(--border)}
td.p{font-weight:600}
td.pm{background:var(--highlight) !important;font-weight:800}
td.rp{color:var(--text-sub);font-size:12px}
td.dp{color:#059669;font-weight:700}
td.dm{color:#dc2626;font-weight:700}
td.nd{color:#d1d5db}
td.pn{text-align:left;font-weight:600;padding-left:12px;min-width:200px}

/* Inventory mode */
.inv-tag{display:inline-block;padding:6px 16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:20px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(99,102,241,.3);white-space:nowrap}
.inv-tag .inv-total{font-size:17px;margin-left:4px}
td.qi{padding:4px 2px}
td.qi input{width:52px;padding:3px 4px;border:1.5px solid var(--border);border-radius:6px;text-align:center;font-size:13px;font-weight:600;background:#fff;transition:border-color .15s}
td.qi input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
td.qi input::-webkit-inner-spin-button{opacity:1}
.ib{font-size:12px;padding:5px 14px;border:1.5px solid #8b5cf6;border-radius:20px;background:#f5f3ff;color:#6d28d9;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:600;-webkit-tap-highlight-color:transparent}
.ib:hover{background:#ede9fe}.ib.active{background:#7c3aed;color:#fff;border-color:#7c3aed}

/* Legend / footer */
.lg{max-width:var(--table-width);margin:0 auto 8px;padding:0 12px;display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text-sub)}
.li{display:flex;align-items:center;gap:4px}
.ls{width:14px;height:14px;border-radius:3px;border:1px solid var(--border)}
.cb{max-width:var(--table-width);margin:4px auto 0;padding:0 12px;font-size:11px;color:var(--text-sub);text-align:right}
.ft{text-align:center;padding:24px 16px;font-size:11px;color:var(--text-sub);line-height:1.8}
.ft a{color:#6366f1}
.ad{text-align:center;padding:12px 16px 24px;font-size:11px}

/* Blog links */
.blog-links{max-width:var(--table-width);margin:24px auto 0;padding:0 16px;display:flex;gap:16px;flex-wrap:wrap}
.blog-card{flex:1;min-width:260px;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;text-decoration:none;color:var(--text);transition:box-shadow .15s}
.blog-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.blog-card h3{font-size:14px;font-weight:700;margin-bottom:6px;color:#6366f1}
.blog-card p{font-size:12px;color:var(--text-sub);line-height:1.7}
.ranking-summary{max-width:var(--table-width);margin:24px auto 0;padding:0 16px}
.ranking-summary .rs-card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 24px}
.ranking-summary h3{font-size:16px;font-weight:700;margin-bottom:12px}
.ranking-summary h3 a{color:var(--text);text-decoration:none}
.ranking-summary h3 a:hover{color:#6366f1}
.rs-list{list-style:none;padding:0;margin:0}
.rs-list li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.rs-list li:last-child{border-bottom:none}
.rs-list .rs-name a{color:var(--text);text-decoration:none}
.rs-list .rs-name a:hover{color:#6366f1}
.rs-list .rs-change{font-weight:700;white-space:nowrap}
.rs-more{display:inline-block;margin-top:10px;font-size:12px;color:#6366f1;text-decoration:none}
.rs-more:hover{text-decoration:underline}
.ad a{color:var(--text-sub);text-decoration:none;border-bottom:1px dashed #d1d5db}
.ad a:hover{color:#6366f1;border-bottom-color:#6366f1}

/* SNS share */
.sns-share{max-width:var(--table-width);margin:16px auto 0;padding:0 16px;display:flex;align-items:center;gap:10px;justify-content:center}
.sns-share span{font-size:12px;color:var(--text-sub);font-weight:600}
.sns-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;transition:opacity .15s}
.sns-btn:hover{opacity:.85}
.sns-btn.x{background:#000;color:#fff}

/* ===== Mobile: <= 768px ===== */
@media(max-width:768px){
  :root{--header-h:48px}
  .header{position:relative;padding:0 12px}
  .header h1{font-size:14px}
  .header .upd{position:static;display:block;font-size:10px;margin-left:8px;flex-shrink:0}

  .fbar{position:relative;padding:8px 10px;gap:6px 10px;justify-content:flex-start}
  .fg{gap:4px}
  .fg label{font-size:11px}
  .fb,.sb{font-size:11px;padding:6px 10px;min-height:32px}

  .tw{margin:8px 6px;border-radius:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:11px}
  thead{top:0}
  thead th{font-size:10px;padding:8px 4px}
  tbody td{font-size:11px;padding:5px 3px}

  /* Sticky first column on mobile */
  td.pn{position:sticky;left:0;z-index:10;min-width:140px;max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding-left:8px}
  td.qi input{width:44px;font-size:11px;padding:2px 3px}
  tr.cat-mega td.pn{background:var(--mega)}
  tr.cat-sv td.pn{background:var(--sv)}
  tr.cat-special td.pn{background:var(--special)}
  tr.cat-ss td.pn{background:#fce4ec}
  tbody tr:hover td.pn{background:#f5f3ff !important}
  tr.cat-mega:hover td.pn{background:#ffe0b2 !important}
  tr.cat-sv:hover td.pn{background:#c8e6c9 !important}
  tr.cat-special:hover td.pn{background:#bbdefb !important}
  tr.cat-ss:hover td.pn{background:#f8bbd0 !important}
  thead th:first-child{position:sticky;left:0;z-index:85;background:#f9fafb}

  tr.sh td{font-size:12px;padding:10px 8px}
  .inv-tag{font-size:12px;padding:5px 12px}
  .inv-tag .inv-total{font-size:15px}
  .lg{padding:0 8px;gap:8px;font-size:10px}
  .cb{padding:0 8px;font-size:10px}
  .ft{font-size:10px;padding:16px 12px}
}

/* ===== Small mobile: <= 480px ===== */
@media(max-width:480px){
  .header h1{font-size:12px}
  .fb,.sb{font-size:10px;padding:5px 8px}
  td.pn{min-width:120px;max-width:150px;font-size:10px}
  thead th{font-size:9px;padding:6px 3px}
  tbody td{font-size:10px;padding:4px 2px}
  thead th.sc{min-width:60px}
}

</style>
</head>

"use strict";
const S=["morimori","homura","icchome","runto","sommelier","kaikyo","shouten","rudeya"];
const S_SS=["homura","runto","morimori","icchome","sommelier","kaikyo","shouten","rudeya"];
const CL={"mega":"MEGA","sv":"SV","special":"スペシャルBOX","ss":"S&S ソード&シールド"};

// {{PRODUCT_DATA}}

// ===== Escape utility =====
function esc(s){
  const d=document.createElement("div");
  d.textContent=s;
  return d.innerHTML;
}

let cc="",vs=new Set(S),sm=false,invMode=false;
const INV_KEY="pokeca_inventory";
function fp(v){if(!v||v===0)return"-";return"\u00a5"+v.toLocaleString()}
function loadInv(){try{return JSON.parse(localStorage.getItem(INV_KEY))||{}}catch(e){return{}}}
function saveInv(inv){localStorage.setItem(INV_KEY,JSON.stringify(inv))}
function getQty(name){return loadInv()[name]||0}
function setQty(name,q){const inv=loadInv();if(q>0)inv[name]=q;else delete inv[name];saveInv(inv)}
function updateTotal(){
  const inv=loadInv();let total=0;
  P.forEach(x=>{const q=inv[x.n]||0;if(q>0){const ap=S.filter(s=>vs.has(s)&&x.p[s]>0).map(s=>x.p[s]);const m=ap.length?Math.max(...ap):0;total+=m*q}});
  document.getElementById("invTotal").textContent="\u00a5"+total.toLocaleString();
}

// ===== Dynamic fbar height measurement =====
function syncFbarHeight(){
  const fb=document.getElementById("fbar");
  if(fb){
    const h=fb.offsetHeight;
    document.documentElement.style.setProperty("--fbar-h",h+"px");
  }
}

function render(){
  const tb=document.getElementById("tb");
  const SO=cc==="ss"?S_SS:S;
  let f=cc===""?P.filter(x=>x.c!=="ss"):cc==="all"?P.slice():P.filter(x=>x.c===cc);
  f.forEach(x=>{
    const ap=SO.filter(s=>vs.has(s)&&x.p[s]>0).map(s=>x.p[s]);
    x._m=ap.length?Math.max(...ap):0;
    x._d=(x.r>0&&x._m>0)?x._m-x.r:0;
  });
  if(sm)f.sort((a,b)=>b._m-a._m);

  // Build rows using DOM to avoid innerHTML XSS
  const frag=document.createDocumentFragment();
  let lc="",cnt=0;

  f.forEach(x=>{
    if(x.c!==lc&&!sm){
      lc=x.c;
      let cs=4+SO.filter(s=>vs.has(s)).length;
      if(invMode)cs+=2;
      const shr=document.createElement("tr");
      shr.className="sh cat-"+x.c;
      const shd=document.createElement("td");
      shd.setAttribute("colspan",cs);
      shd.textContent=CL[x.c]+" シリーズ";
      shr.appendChild(shd);
      frag.appendChild(shr);
    }
    cnt++;
    const tr=document.createElement("tr");
    tr.className="cat-"+x.c;

    // Product name (links to individual page)
    const tdN=document.createElement("td");
    tdN.className="pn";
    const aName=document.createElement("a");
    aName.href="box/"+x.s+".html";
    aName.textContent=x.n;
    aName.style.cssText="color:inherit;text-decoration:none;border-bottom:1px dashed #c4b5fd";
    tdN.appendChild(aName);
    tr.appendChild(tdN);

    // Quantity (inventory mode)
    if(invMode){
      const tdQ=document.createElement("td");
      tdQ.className="qi";
      const inp=document.createElement("input");
      inp.type="number";inp.min="0";inp.max="999";
      inp.value=getQty(x.n);
      inp.addEventListener("change",function(){const v=Math.max(0,parseInt(this.value)||0);this.value=v;setQty(x.n,v);render()});
      tdQ.appendChild(inp);
      tr.appendChild(tdQ);
    }

    // Retail price
    const tdR=document.createElement("td");
    tdR.className="rp";
    tdR.textContent=x.r>0?fp(x.r):"-";
    tr.appendChild(tdR);

    // Max buyback
    const tdM=document.createElement("td");
    tdM.className="p";
    tdM.style.fontWeight="800";
    tdM.textContent=fp(x._m);
    tr.appendChild(tdM);

    // Subtotal (inventory mode)
    if(invMode){
      const tdSub=document.createElement("td");
      const q=getQty(x.n);
      const sub=q*x._m;
      if(sub>0){tdSub.className="p";tdSub.style.fontWeight="700";tdSub.style.color="#7c3aed";tdSub.textContent=fp(sub)}
      else{tdSub.className="nd";tdSub.textContent="-"}
      tr.appendChild(tdSub);
    }

    // Profit diff
    const tdD=document.createElement("td");
    if(x._d>0){tdD.className="dp";tdD.textContent="+\u00a5"+x._d.toLocaleString()}
    else if(x._d<0){tdD.className="dm";tdD.textContent="-\u00a5"+Math.abs(x._d).toLocaleString()}
    else{tdD.className="nd";tdD.textContent="-"}
    tr.appendChild(tdD);

    // Shop prices
    SO.forEach(s=>{
      if(!vs.has(s))return;
      const td=document.createElement("td");
      const v=x.p[s];
      if(!v||v===0){td.className="nd";td.textContent="-"}
      else if(v===x._m&&x._m>0){td.className="p pm";td.textContent=fp(v)}
      else{td.className="p";td.textContent=fp(v)}
      tr.appendChild(td);
    });

    frag.appendChild(tr);
  });

  tb.textContent="";
  tb.appendChild(frag);
  document.getElementById("rc").textContent=cnt;
  // Reorder thead shop columns to match SO
  var thr=document.querySelector("thead tr");
  var scThs={};
  document.querySelectorAll("thead th.sc").forEach(function(th){scThs[th.dataset.s]=th;th.style.display=vs.has(th.dataset.s)?"":"none"});
  SO.forEach(function(s){if(scThs[s])thr.appendChild(scThs[s])});
  document.querySelectorAll("thead th.inv-col").forEach(function(th){th.style.display=invMode?"":"none"});
  if(invMode)updateTotal();
}

// ===== Event listeners =====
document.querySelectorAll("[data-f='cat']").forEach(function(b){
  b.addEventListener("click",function(){
    if(b.classList.contains("active")){
      b.classList.remove("active");
      cc="";
    }else{
      document.querySelectorAll("[data-f='cat']").forEach(function(x){x.classList.remove("active")});
      b.classList.add("active");
      cc=b.dataset.v;
    }
    render();
  });
});

const ab=document.querySelector("[data-s='all']");
document.querySelectorAll(".st").forEach(function(b){
  b.addEventListener("click",function(){
    var s=b.dataset.s;
    if(s==="all"){
      var a=S.every(function(x){return vs.has(x)});
      if(a){vs.clear();document.querySelectorAll(".st").forEach(function(x){x.classList.remove("active")})}
      else{S.forEach(function(x){vs.add(x)});document.querySelectorAll(".st").forEach(function(x){x.classList.add("active")})}
    }else{
      if(vs.has(s)){vs.delete(s);b.classList.remove("active")}
      else{vs.add(s);b.classList.add("active")}
      ab.classList.toggle("active",S.every(function(x){return vs.has(x)}));
    }
    render();
  });
});

document.getElementById("srt").addEventListener("click",function(){
  sm=!sm;
  this.classList.toggle("active",sm);
  this.textContent=sm?"最高買取順 \u25b2 (ON)":"最高買取順 \u25bc";
  render();
});

document.getElementById("invBtn").addEventListener("click",function(){
  invMode=!invMode;
  this.classList.toggle("active",invMode);
  document.getElementById("invBar").style.display=invMode?"":"none";
  render();
});

// ===== Init =====
// Measure fbar height on load and resize
syncFbarHeight();
window.addEventListener("resize",syncFbarHeight);
if(typeof ResizeObserver!=="undefined"){
  new ResizeObserver(syncFbarHeight).observe(document.getElementById("fbar"));
}

render();

// ===== Random blog card (left slot) =====
(function(){
  var cards=document.querySelectorAll("#blogLinks .blog-random");
  if(!cards.length)return;
  var pick=Math.floor(Math.random()*cards.length);
  cards[pick].style.display="";
})();
</script>
</body>
</html>
