name: Debug Oku Reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        continue-on-error: true
        run: curl -s --max-time 15 https://ipinfo.io/json || true

      - name: TCP 443 reachability
        continue-on-error: true
        run: timeout 15 bash -c 'cat < /dev/null > /dev/tcp/85.131.210.36/443' && echo "TCP443=OPEN" || echo "TCP443=BLOCKED"

      - name: TCP 80 reachability
        continue-on-error: true
        run: timeout 15 bash -c 'cat < /dev/null > /dev/tcp/85.131.210.36/80' && echo "TCP80=OPEN" || echo "TCP80=BLOCKED"

      - name: A) HTTPS direct
        continue-on-error: true
        run: curl -sS -o /dev/null -w "A_https=%{http_code} t=%{time_total}\n" --max-time 20 "https://kaitori-oku.jp/category.html?cat1=340&cat2=363" || echo "A_https=FAIL"

      - name: B) HTTP port 80
        continue-on-error: true
        run: curl -sS -o /dev/null -w "B_http=%{http_code} t=%{time_total}\n" --max-time 20 "http://kaitori-oku.jp/category.html?cat1=340&cat2=363" || echo "B_http=FAIL"

      - name: C) Browser UA
        continue-on-error: true
        run: curl -sS -o /dev/null -w "C_ua=%{http_code} t=%{time_total}\n" --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36" "https://kaitori-oku.jp/category.html?cat1=340&cat2=363" || echo "C_ua=FAIL"

      - name: D) IPv6 attempt
        continue-on-error: true
        run: curl -sS -6 -o /dev/null -w "D_v6=%{http_code}\n" --max-time 15 "https://kaitori-oku.jp/" || echo "D_v6=FAIL"

      - name: E) r.jina.ai proxy
        continue-on-error: true
        run: curl -sS --max-time 30 "https://r.jina.ai/https://kaitori-oku.jp/category.html?cat1=340&cat2=363" -o e.txt -w "E_jina=%{http_code} bytes=%{size_download}\n" && grep -c '¥' e.txt | sed 's/^/E_yen_lines=/' || echo "E_jina=FAIL"

      - name: F) codetabs proxy
        continue-on-error: true
        run: curl -sS --max-time 30 "https://api.codetabs.com/v1/proxy?quest=https://kaitori-oku.jp/category.html%3Fcat1%3D340%26cat2%3D363" -o f.txt -w "F_codetabs=%{http_code} bytes=%{size_download}\n" && grep -c 'class="price"' f.txt | sed 's/^/F_price_count=/' || echo "F_codetabs=FAIL"

      - name: G) allorigins proxy
        continue-on-error: true
        run: curl -sS --max-time 30 "https://api.allorigins.win/raw?url=https%3A%2F%2Fkaitori-oku.jp%2Fcategory.html%3Fcat1%3D340%26cat2%3D363" -o g.txt -w "G_allorigins=%{http_code} bytes=%{size_download}\n" && grep -c 'class="price"' g.txt | sed 's/^/G_price_count=/' || echo "G_allorigins=FAIL"
