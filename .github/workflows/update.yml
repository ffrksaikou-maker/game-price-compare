name: Update Prices

on:
  schedule:
    # JST 11:00, 15:00, 18:00 (3 times daily)
    - cron: '0 2,6,9 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        # 森森(morimori-kaitori.jp)が headless を BOT 検出して弾くため、
        # 仮想ディスプレイ上で headful Chromium を動かす必要がある。
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper
        run: xvfb-run -a python scraper/main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html ranking.html sitemap.xml \
            data/cache.json data/history/ data/x_state/ \
            box/ weekly/ \
            sv-box-list.html mega-box-list.html ss-box-list.html \
            151-spotlight.html kokuen-spotlight.html inferno-x-spotlight.html \
            chouden-breaker-spotlight.html clay-burst-spotlight.html \
            ninja-spinner-spotlight.html rocket-dan-no-eiko-spotlight.html \
            abyss-eye-forecast.html
          git diff --staged --quiet || git commit -m "Update prices $(TZ=Asia/Tokyo date +%Y-%m-%d_%H:%M)"
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop || true
          git push
