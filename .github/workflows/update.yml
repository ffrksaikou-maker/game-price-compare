name: Update Prices

on:
  schedule:
    # JST 11:00, 15:00, 18:00 (3 times daily)
    - cron: '0 2,6,9 * * *'
  workflow_dispatch:
    inputs:
      shops:
        description: '取得する店をカンマ区切りで指定 (空=全店)。例: collect_tendo,morimori'
        required: false
        default: ''
      with_mercari:
        description: 'メルカリのフリマ相場も取得する (通常は別ワークフローで1日1回)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 取得失敗店の再試行(最大5分待ち)を含むため通常実行より余裕を持たせる
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        # --with-deps を付けると apt 経由で packages.microsoft.com を叩きに行き、
        # 同リポジトリが 403 を返す GitHub 側の一時障害でジョブ全体が落ちる。
        # ubuntu-latest には Chromium 動作に必要なライブラリが揃っているため不要。
        run: playwright install chromium

      - name: Install Xvfb
        # 森森(morimori-kaitori.jp)が headless を BOT 検出して弾くため、
        # 仮想ディスプレイ上で headful Chromium を動かす必要がある。
        # 壊れがちな Microsoft apt リポジトリを先に除去して 403 で apt が死ぬのを防ぐ。
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper
        run: xvfb-run -a python scraper/main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_SHOPS: ${{ inputs.shops }}
          # メルカリ相場(44商品で10分前後)は mercari.yml が1日1回だけ取る。
          # ここで毎回取ると買取価格の反映がその待ち時間ぶん遅れる。
          SCRAPER_SKIP_MERCARI: ${{ inputs.with_mercari && '0' || '1' }}
          # 1店あたりの上限(8分)。応答しない店があってもそこで打ち切り、
          # 他店の取得結果とコミットまで到達させる。
          SHOP_TIMEOUT_SECONDS: '480'
          # 全体の目安(25分)。timeout-minutes: 35 に対して余裕を持たせ、
          # これを超えていたら失敗店の再試行(+300秒待機)を諦める。
          JOB_DEADLINE_SECONDS: '1500'

      # sitemap再生成後・コミット前に走らせ、送信記録を同じコミットに含める。
      # 送信対象は lastmod が前回送信時から変わったURLのみ。失敗してもCIは止めない。
      - name: Notify IndexNow
        continue-on-error: true
        run: python scripts/indexnow.py --new

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html ranking.html sitemap.xml articles.html \
            onepiece.html onepiece/ \
            beyblade.html \
            dragonball.html \
            data/cache.json data/history/ data/history_op/ data/history_bey/ \
            data/history_db/ \
            data/mercari_beyblade.json data/x_state/ \
            data/cache_fallback_counts.json data/cache_meta.json \
            data/stale_counts.json data/anomaly_state.json \
            data/indexnow_sent.json \
            box/ weekly/ shop/ \
            monthly-ranking-*.html \
            sv-box-list.html mega-box-list.html ss-box-list.html \
            151-spotlight.html kokuen-spotlight.html inferno-x-spotlight.html \
            chouden-breaker-spotlight.html clay-burst-spotlight.html \
            ninja-spinner-spotlight.html rocket-dan-no-eiko-spotlight.html \
            mega-ex-spotlight.html mega-brave-spotlight.html \
            battle-collection-spotlight.html \
            abyss-eye-forecast.html storm-emeralda-forecast.html
          git diff --staged --quiet || git commit -m "Update prices $(TZ=Asia/Tokyo date +%Y-%m-%d_%H:%M)"
          git stash --include-untracked
          # run が重なると生成物どうしが衝突して rebase が止まり、
          # ジョブごと落ちて価格が反映されない。生成物は毎回作り直せるので
          # -X theirs で自分の生成結果を採り、相手の記事追加等は取り込む。
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin master && git push; then
              pushed=1
              break
            fi
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          git stash pop || true
          if [ "$pushed" != 1 ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
